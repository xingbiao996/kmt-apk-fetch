name: fetch-kmt-apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Try 1 - apkeep from Google Play (latest version)
        continue-on-error: true
        run: |
          set -e
          mkdir -p out
          URL=$(curl -s https://api.github.com/repos/EFForg/apkeep/releases/latest | python3 -c "import sys,json;a=json.load(sys.stdin)['assets'];print(next(x['browser_download_url'] for x in a if 'linux' in x['name'] and 'gnu' in x['name']))")
          echo "asset: $URL"
          curl -sfL -o apkeep.tar.gz "$URL"
          tar xzf apkeep.tar.gz apkeep
          if ./apkeep -a com.DLTech.KMT -d play out && ls out/*.apk >/dev/null 2>&1; then
            echo "SOURCE=play" >> "$GITHUB_ENV"
          else
            echo "apkeep failed, will try fallback"
            rm -f out/*.apk || true
            exit 1
          fi

      - name: Try 2 - apkpure official API fallback
        if: ${{ env.SOURCE != 'play' }}
        run: |
          set -e
          mkdir -p out
          RESP=$(curl -sf -H 'x-sv: 29' -H 'x-abis: arm64-v8a,armeabi-v7a,armeabi' -H 'x-gp: 1' \
            "https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=com.DLTech.KMT" || true)
          LINK=$(printf '%s' "$RESP" | grep -oE 'https:[^"]+/APK[^"]*' | head -1)
          if [ -n "$LINK" ]; then
            curl -sfL -D headers.txt -o out/com.DLTech.KMT.apk "$LINK"
            grep -i content-disposition headers.txt || true
            echo "SOURCE=pureapk" >> "$GITHUB_ENV"
          else
            echo "no link found"; printf '%s' "$RESP" | head -c 500
            exit 1
          fi

      - name: Verify artifact
        run: |
          set -e
          APK=$(ls out/*.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          test -s "$APK"
          sha256sum "$APK"
          python3 - <<EOF
          import zipfile
          z = zipfile.ZipFile("$APK")
          assert "AndroidManifest.xml" in z.namelist(), "not an apk"
          print("entries:", len(z.namelist()))
          EOF

      - name: Create release with asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kmt-${{ github.run_number }}
          name: KMT app APK (com.DLTech.KMT)
          files: ${{ env.APK }}
          body: >
            Fetched via ${{ env.SOURCE }} for package com.DLTech.KMT
            (China Kuomintang Digital Party app, developer 社團法人中國國民黨).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
